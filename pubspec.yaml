name: clutch
description: "CLUTCH - Your Deadline Survival Agent."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  just_audio: ^0.10.4
  google_fonts: ^6.2.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App icon: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 24

# Launch screen shown before Flutter starts: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A0A0A"
  image: assets/icon/splash_logo.png
  android_12:
    color: "#0A0A0A"
    image: assets/icon/splash_android12.png
  ios: false
  web: false
